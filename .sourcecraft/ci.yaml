on:
  push:
    - workflows: [build-site]
      filter:
        branches: ["main"]

workflows:
  build-site:
    tasks:
      - name: build-and-deploy
        cubes:
          - name: mkdocs-deploy
            image: docker.io/library/python:3.12
            script:
              - apt-get update && apt-get install -y git
              - python -m pip install --upgrade pip
              - pip install mkdocs mkdocs-material
              - pip install git+https://github.com/dracula/mkdocs.git
              - mkdocs build --site-dir _build --clean
              - git config user.name "SourceCraft CI"
              - git config user.email "ci@sourcecraft.dev"
              - git checkout -B release
              - find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '_build' -exec rm -rf {} +
              - cp -R _build/. .
              - rm -rf _build
              - git add -A
              - git diff --cached --quiet || git commit -m "Automated deploy"
              - git push -f origin release
